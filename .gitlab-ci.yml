stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  DOCKER_DRIVER: overlay2

# Build Docker image
build-docker-image:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - export IMAGE_TAG=${CI_COMMIT_SHORT_SHA:-latest}
    - echo "Building Docker image with tag $IMAGE_TAG"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - echo "IMAGE_TAG=$IMAGE_TAG" > image_info.env
  artifacts:
    reports:
      dotenv: image_info.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

# Deploy to development
deploy-dev:
  image: hamravesh.hamdocker.ir/public/darkube-cli:v1.1
  stage: deploy
  script:
    - echo "Deploying with image tag $IMAGE_TAG"
    - darkube deploy --token $DARKUBE_DEV_TOKEN --app-id $DARKUBE_DEV_APP_ID --image-tag "$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: always
  needs:
    - job: build-docker-image
      artifacts: true
